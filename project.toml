[_]
schema-version = "0.2"

# Install system libraries required by Chrome/Chromium for Puppeteer.
# On Heroku Fir (CNB), the classic chrome-for-testing buildpack isn't available,
# so we install Chrome's dependencies via heroku/deb-packages and let Puppeteer
# download its own Chrome binary during npm install / heroku-postbuild.
[com.heroku.buildpacks.deb-packages]
install = [
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxrandr2",
  "libgbm1",
  "libpango-1.0-0",
  "libcairo2",
  "libasound2t64",
  "libxshmfence1",
  "libx11-xcb1",
  "libxcb-dri3-0",
  "fonts-liberation",
  "fontconfig",
  "ffmpeg",
]
